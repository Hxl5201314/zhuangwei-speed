name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer kivy
      - name: Build APK
        run: buildozer android debug
      - name: Find APK
        run: find . -name "*.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: ./.buildozer/android/platform/build-*/dists/*/__armeabi-v7a/*.apk
